name: civic-evidence-rag-starter
region: tor
services:
  - name: web
    github:
      repo: insightfull-data/civic-evidence-rag-starter
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
        scope: RUN_TIME
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
        scope: RUN_TIME
jobs:
  - name: setup-database
    kind: PRE_DEPLOY
    github:
      repo: insightfull-data/civic-evidence-rag-starter
      branch: main
    dockerfile_path: Dockerfile
    run_command: npm run db:setup
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
