services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: civic_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - civic-rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civic_rag"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/civic_rag
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  civic-rag-data:
